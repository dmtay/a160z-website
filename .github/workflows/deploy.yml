name: Deploy to a160z.com

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cPanel Git Deployment
        run: |
          response=$(curl -s -o /tmp/cpanel_response.txt -w "%{http_code}" -X POST \
            "https://${{ secrets.CPANEL_URL }}:2083/execute/VersionControlDeployment/create" \
            -H "Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}" \
            --data-urlencode "repository_root=/home/apppaymy/public_html/a160z.com" \
            --insecure)
          echo "HTTP Status: $response"
          cat /tmp/cpanel_response.txt
          if [ "$response" != "200" ]; then
            echo "Deployment failed with status $response"
            exit 1
          fi
          echo "Deployment triggered successfully!"
